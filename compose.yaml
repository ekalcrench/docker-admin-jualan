services:
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    env_file: ./backend/.env.production
    environment:
      DATABASE_URL: postgresql://app:${DB_PASSWORD}@db:5432/dbadminjualan?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  db:
    image: postgres:17
    container_name: admin-jualan-db
    ports:
      - "5434:5432"
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: dbadminjualan
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d dbadminjualan"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: admin-jualan-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://nginx:80
    depends_on:
      - nginx

volumes:
  postgres_data:
